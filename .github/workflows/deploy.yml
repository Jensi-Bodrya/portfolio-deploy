name: Deploy environment from GHCR

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [dev, dev-2, prod]
        default: dev-2
        required: true
      image:
        description: Immutable GHCR ref e.g. ghcr.io/jensi-bodrya/portfolio-images:feat-x-abcdef1
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oras-project/setup-oras@v1
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Validate image reference and target
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_IMAGE: ${{ inputs.image }}
        run: python3 scripts/deploy_oci.py --environment "$TARGET_ENV" --image "$TARGET_IMAGE" --dry-run
      - name: Pull OCI site and deploy to selected Surge domain
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_IMAGE: ${{ inputs.image }}
        run: python3 scripts/deploy_oci.py --environment "$TARGET_ENV" --image "$TARGET_IMAGE"
