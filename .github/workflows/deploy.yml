name: Deploy environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev-2
        type: choice
        options:
          - dev
          - dev-2
          - prod
      image:
        description: Image id to deploy (leave blank to use the environment's pinned image)
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Surge
        run: npm install -g surge

      - name: Resolve deployment plan
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_IMAGE: ${{ inputs.image }}
        run: |
          args=(--environment "$TARGET_ENV" --dry-run)
          if [[ -n "$TARGET_IMAGE" ]]; then
            args+=(--image "$TARGET_IMAGE")
          fi
          python3 scripts/deploy_env.py "${args[@]}"

      - name: Deploy
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_IMAGE: ${{ inputs.image }}
        run: |
          args=(--environment "$TARGET_ENV")
          if [[ -n "$TARGET_IMAGE" ]]; then
            args+=(--image "$TARGET_IMAGE")
          fi
          python3 scripts/deploy_env.py "${args[@]}"

      - name: Persist image pin
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_IMAGE: ${{ inputs.image }}
        run: |
          if [[ -z "$TARGET_IMAGE" ]]; then
            echo "No override requested — pin unchanged."
            exit 0
          fi
          if [[ -z "$(git status --porcelain environments/)" ]]; then
            echo "Pin already at $TARGET_IMAGE."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add environments/
          git commit -m "chore($TARGET_ENV): pin to image $TARGET_IMAGE"
          git push

      - name: Summary
        if: always()
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TARGET_IMAGE: ${{ inputs.image }}
        run: |
          {
            echo "### Deployment: $TARGET_ENV"
            echo ""
            if [[ -n "$TARGET_IMAGE" ]]; then
              echo "Requested image: \`$TARGET_IMAGE\`"
            else
              echo "Deployed the image pinned in \`environments/$TARGET_ENV.yaml\`"
            fi
            echo ""
            echo "Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"