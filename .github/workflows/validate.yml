name: Check deployment chart

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate each environment and OCI pin
        run: |
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          from lib import load_env
          for path in sorted(pathlib.Path("environments").glob("*.yaml")):
              env = load_env(path.stem)
              image = env["image"]
              if not image.startswith("ghcr.io/jensi-bodrya/portfolio-images:"):
                  raise SystemExit(f"{path}: invalid image reference: {image}")
              print(f"{path.stem}: {env['domain']} <- {image}")
          PY

  workflow-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow yaml parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path(".github/workflows").glob("*.yml"):
              data = yaml.safe_load(path.read_text())
              if not isinstance(data, dict) or "jobs" not in data:
                  raise SystemExit(f"invalid workflow: {path}")
              print(f"valid: {path}")
          PY
